<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регламент цен / Narxlar reglamenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/prices.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <main class="prices-page">
      <header class="prices-header">
        <img class="brand-image" src="/brand-logo.png" alt="Logo" />
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="ru" aria-pressed="true">Русский</button>
          <button type="button" class="lang-btn" data-lang="uz" aria-pressed="false">O‘zbekcha</button>
        </div>
        <h1 id="prices-title">Загрузка…</h1>
        <p id="prices-notice" class="prices-notice"></p>
        <p id="prices-updated" class="prices-updated" hidden></p>
      </header>

      <p id="prices-status" class="prices-status">Загрузка…</p>
      <div id="prices-catalog" class="prices-catalog" hidden></div>
    </main>

    <script src="/js/prices.js"></script>
  </body>
</html>
