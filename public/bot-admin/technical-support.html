<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Техподдержка — админ-панель бота</title>
    <link rel="stylesheet" href="/bot-admin/admin.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div class="header-top">
          <div>
            <h1>Техподдержка</h1>
            <p>Цены, ручная активация и управление подписками техподдержки.</p>
          </div>
          <div class="account-menu" id="account-menu">
            <button type="button" class="account-menu__avatar" id="account-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Аккаунт">
              <span class="account-menu__initials" id="account-menu-initials">?</span>
            </button>
            <div class="account-menu__dropdown" id="account-menu-dropdown" hidden>
              <div class="account-menu__identity" id="account-menu-identity"></div>
              <button type="button" class="account-menu__item" id="account-credentials-btn" hidden>Сменить логин и пароль</button>
              <button type="button" class="account-menu__item account-menu__item--danger" id="logout-btn">Выйти</button>
            </div>
          </div>
        </div>
        <nav class="admin-nav" aria-label="Разделы админ-панели">
          <a class="admin-nav__link" href="/bot-admin/">Пользователи</a>
          <a class="admin-nav__link" href="/bot-admin/orders">Заказы</a>
          <a class="admin-nav__link" href="/bot-admin/order-logs">Журнал заказов</a>
          <a class="admin-nav__link" href="/bot-admin/logs">Журнал</a>
          <a class="admin-nav__link" href="/bot-admin/tickets">Тикеты</a>
          <a class="admin-nav__link admin-nav__link--active" href="/bot-admin/technical-support" aria-current="page">Техподдержка</a>
          <a class="admin-nav__link" href="/bot-admin/prices">Прайс</a>
          <a class="admin-nav__link" href="/bot-admin/settings">Настройки</a>
        </nav>
      </header>

      <section class="card">
        <div class="card-toolbar">
          <h2>Цены</h2>
        </div>
        <form id="prices-form" class="price-form">
          <div class="price-grid" id="prices-grid"></div>
          <p id="prices-message" class="message" hidden></p>
          <div class="modal-footer" style="justify-content: flex-start; margin-top: 16px;">
            <button type="submit" class="btn btn-primary" id="prices-submit">Сохранить цены</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-toolbar">
          <h2>Подписки</h2>
          <div class="card-toolbar-right">
            <div class="search-box" id="search-box">
              <span class="search-box__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input
                type="search"
                id="subscription-search"
                class="search-box__input"
                placeholder="Поиск по телефону или ID заказа…"
                autocomplete="off"
                enterkeyhint="search"
              />
              <button type="button" class="search-box__clear" id="search-clear" aria-label="Очистить поиск" hidden>&times;</button>
            </div>
            <label class="field field-inline">
              <span>Статус</span>
              <select id="status-filter">
                <option value="">Все</option>
                <option value="active">Активные</option>
                <option value="expired">Истёкшие</option>
              </select>
            </label>
            <button type="button" class="btn btn-secondary btn-sm" id="refresh-subscriptions-btn">Обновить</button>
            <button type="button" class="btn btn-primary btn-sm" id="create-subscription-btn" hidden>Добавить подписку</button>
          </div>
        </div>
        <div id="subscriptions-wrap"></div>
        <div id="subscriptions-pagination" class="pagination-wrap"></div>
      </section>
    </main>

    <div class="modal-overlay" id="create-subscription-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-subscription-title">
        <div class="modal-header">
          <h3 id="create-subscription-title">Новая подписка</h3>
          <button type="button" class="modal-close" id="create-subscription-close" aria-label="Закрыть">&times;</button>
        </div>
        <form id="create-subscription-form" class="modal-body">
          <label class="field">
            <span>Телефон</span>
            <input type="text" name="phone" id="create-phone" required placeholder="+998901112233" autocomplete="off" />
          </label>
          <label class="field">
            <span>Срок</span>
            <select name="months" id="create-months" required>
              <option value="1">1 месяц</option>
              <option value="3" selected>3 месяца</option>
              <option value="6">6 месяцев</option>
              <option value="12">12 месяцев</option>
              <option value="custom">custom</option>
            </select>
            <span class="field-hint">Сумма и дата окончания доступны только для custom</span>
          </label>
          <label class="field">
            <span>Дата окончания</span>
            <input type="date" name="ends_at" id="create-ends-at" required />
          </label>
          <label class="field">
            <span>Сумма (необязательно)</span>
            <input type="number" name="amount" id="create-amount" min="0" step="1" value="0" />
            <span class="field-hint">Для ручной активации обычно 0</span>
          </label>
          <p id="create-subscription-error" class="message error" hidden></p>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="create-subscription-cancel">Отмена</button>
            <button type="submit" class="btn btn-primary" id="create-subscription-submit">Активировать</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="edit-subscription-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-subscription-title">
        <div class="modal-header">
          <h3 id="edit-subscription-title">Изменить окончание</h3>
          <button type="button" class="modal-close" id="edit-subscription-close" aria-label="Закрыть">&times;</button>
        </div>
        <form id="edit-subscription-form" class="modal-body">
          <input type="hidden" id="edit-subscription-id" />
          <p class="field-hint" id="edit-subscription-meta"></p>
          <label class="field">
            <span>Дата окончания</span>
            <input type="date" name="ends_at" id="edit-ends-at" required />
          </label>
          <p id="edit-subscription-error" class="message error" hidden></p>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="edit-subscription-cancel">Отмена</button>
            <button type="submit" class="btn btn-primary" id="edit-subscription-submit">Сохранить</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/bot-admin/admin-common.js"></script>
    <script src="/bot-admin/admin-technical-support.js"></script>
  </body>
</html>
