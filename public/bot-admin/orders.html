<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заказы — админ-панель бота</title>
    <link rel="stylesheet" href="/bot-admin/admin.css" />
  </head>
  <body>
    <main class="page page--wide">
      <header class="header">
        <div class="header-top">
          <div>
            <h1>Заказы</h1>
            <p>Список всех заказов. Для неоплаченных — удаление, оплата наличными и повторное уведомление.</p>
          </div>
          <div class="account-menu" id="account-menu">
            <button type="button" class="account-menu__avatar" id="account-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Аккаунт">
              <span class="account-menu__initials" id="account-menu-initials">?</span>
            </button>
            <div class="account-menu__dropdown" id="account-menu-dropdown" hidden>
              <div class="account-menu__identity" id="account-menu-identity"></div>
              <button type="button" class="account-menu__item" id="account-credentials-btn" hidden>Сменить логин и пароль</button>
              <button type="button" class="account-menu__item account-menu__item--danger" id="logout-btn">Выйти</button>
            </div>
          </div>
        </div>
        <nav class="admin-nav" aria-label="Разделы админ-панели">
          <a class="admin-nav__link" href="/bot-admin/">Пользователи</a>
          <a class="admin-nav__link admin-nav__link--active" href="/bot-admin/orders" aria-current="page">Заказы</a>
          <a class="admin-nav__link" href="/bot-admin/order-logs">Журнал заказов</a>
          <a class="admin-nav__link" href="/bot-admin/logs">Журнал</a>
          <a class="admin-nav__link" href="/bot-admin/tickets">Тикеты</a>
          <a class="admin-nav__link" href="/bot-admin/technical-support">Техподдержка</a>
          <a class="admin-nav__link" href="/bot-admin/prices">Прайс</a>
          <a class="admin-nav__link" href="/bot-admin/settings">Настройки</a>
        </nav>
      </header>

      <section class="card">
        <div class="card-toolbar">
          <h2>Фильтры</h2>
        </div>
        <form id="order-filters" class="ticket-filters">
          <div class="ticket-filters__row">
            <div class="search-box" id="search-box">
              <span class="search-box__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </span>
              <input
                type="search"
                id="order-search"
                class="search-box__input"
                placeholder="Поиск по ID, телефону…"
                autocomplete="off"
                enterkeyhint="search"
              />
              <button type="button" class="search-box__clear" id="search-clear" aria-label="Очистить поиск" hidden>&times;</button>
            </div>

            <label class="field field-inline">
              <span>Клиент</span>
              <input
                type="search"
                id="client-filter"
                placeholder="Телефон клиента"
                autocomplete="off"
                enterkeyhint="search"
              />
            </label>

            <label class="field field-inline">
              <span>Статус</span>
              <select id="status-filter">
                <option value="">Все статусы</option>
                <option value="pending">Неоплачен</option>
                <option value="paid">Оплачен</option>
                <option value="paid_cash">Наличные</option>
                <option value="deleted">Удалён</option>
              </select>
            </label>

            <label class="field field-inline">
              <span>С</span>
              <input type="date" id="date-from" />
            </label>
            <label class="field field-inline">
              <span>По</span>
              <input type="date" id="date-to" />
            </label>

            <div class="ticket-filters__actions">
              <button type="submit" class="btn btn-primary btn-sm" id="apply-filters-btn">Применить</button>
              <button type="button" class="btn btn-secondary btn-sm" id="refresh-orders-btn">Обновить</button>
            </div>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-toolbar">
          <h2>Заказы</h2>
        </div>
        <div id="orders-wrap"></div>
        <div id="orders-pagination" class="pagination-wrap"></div>
      </section>
    </main>

    <script src="/bot-admin/admin-common.js"></script>
    <script src="/bot-admin/admin-orders.js"></script>
  </body>
</html>
