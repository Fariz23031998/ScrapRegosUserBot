<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Прайс — админ-панель бота</title>
    <link rel="stylesheet" href="/bot-admin/admin.css" />
  </head>
  <body>
    <main class="page page--wide">
      <header class="header">
        <div class="header-top">
          <div>
            <h1>Прайс услуг</h1>
            <p>Публичный каталог на русском и узбекском (лотиница). Сохранение заменяет весь прайс.</p>
          </div>
          <div class="account-menu" id="account-menu">
            <button type="button" class="account-menu__avatar" id="account-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Аккаунт">
              <span class="account-menu__initials" id="account-menu-initials">?</span>
            </button>
            <div class="account-menu__dropdown" id="account-menu-dropdown" hidden>
              <div class="account-menu__identity" id="account-menu-identity"></div>
              <button type="button" class="account-menu__item" id="account-credentials-btn" hidden>Сменить логин и пароль</button>
              <button type="button" class="account-menu__item account-menu__item--danger" id="logout-btn">Выйти</button>
            </div>
          </div>
        </div>
        <nav class="admin-nav" aria-label="Разделы админ-панели">
          <a class="admin-nav__link" href="/bot-admin/">Пользователи</a>
          <a class="admin-nav__link" href="/bot-admin/orders">Заказы</a>
          <a class="admin-nav__link" href="/bot-admin/order-logs">Журнал заказов</a>
          <a class="admin-nav__link" href="/bot-admin/tickets">Тикеты</a>
          <a class="admin-nav__link" href="/bot-admin/technical-support">Техподдержка</a>
          <a class="admin-nav__link admin-nav__link--active" href="/bot-admin/prices" aria-current="page">Прайс</a>
        </nav>
      </header>

      <section class="card">
        <div class="card-toolbar">
          <h2>Метаданные</h2>
          <div class="card-toolbar-right">
            <a class="btn btn-secondary btn-sm" href="/prices" target="_blank" rel="noopener">Открыть публичную страницу</a>
            <button type="button" class="btn btn-primary" id="save-catalog-btn">Сохранить прайс</button>
          </div>
        </div>
        <p id="catalog-message" class="message" hidden></p>
        <div class="bilingual-grid">
          <label class="field">
            <span>Заголовок (RU)</span>
            <input type="text" id="title-ru" maxlength="200" required />
          </label>
          <label class="field">
            <span>Sarlavha (UZ)</span>
            <input type="text" id="title-uz" maxlength="200" required />
          </label>
          <label class="field">
            <span>Уведомление (RU)</span>
            <textarea id="notice-ru" rows="3" maxlength="1000" required></textarea>
          </label>
          <label class="field">
            <span>Eslatma (UZ)</span>
            <textarea id="notice-uz" rows="3" maxlength="1000" required></textarea>
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-toolbar">
          <h2>Категории и услуги</h2>
          <button type="button" class="btn btn-secondary btn-sm" id="add-category-btn">+ Категория</button>
        </div>
        <div id="categories-editor"></div>
      </section>
    </main>

    <script src="/bot-admin/admin-common.js"></script>
    <script src="/bot-admin/admin-prices.js"></script>
  </body>
</html>
